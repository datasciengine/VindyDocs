<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deploy OK</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #fff;
    }
    .card {
      text-align: center;
      padding: 2rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #16a34a;
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p { color: #888; }
    code {
      background: #1a1a1a;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="dot"></span>
      DEPLOY OK
    </div>
    <h1>Vercel çalışıyor 🚀</h1>
    <p>Bu sayfayı görüyorsan deploy başarılı.</p>
  </div>
  <script>
    // Deploy zamanını göstermek istersen:
    document.querySelector('.card').insertAdjacentHTML(
      'beforeend',
      '<p style="margin-top:1rem;font-size:0.8rem"><code>' + new Date().toLocaleString('tr-TR') + '</code></p>'
    );
  </script>
</body>
</html>
